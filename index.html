<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>₱ Finanzas</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://pmtaaqdogvbsfwxqkuns.supabase.co";
  const SUPABASE_ANON_KEY = "PEGÁ_ACÁ_TU_ANON_KEY_REAL";

  const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );
</script>


  <!-- TODO TU CSS ORIGINAL NO SE TOCA -->
</head>

<body>

<!-- ✅ TODO TU HTML ORIGINAL SE MANTIENE -->

<script>
/* =========================================================
   VARIABLES GLOBALES
========================================================= */
let currentUser = null;
let DB = {
  gastos: [],
  fijos: [],
  programados: [],
  config: {}
};

/* =========================================================
   AUTH - SUPABASE
========================================================= */

async function doLogin() {
  const email = document.getElementById("login-user").value.trim();
  const password = document.getElementById("login-pass").value;

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    alert(error.message);
    return;
  }

  currentUser = data.user;
  startApp();
}

async function doRegister() {
  const email = document.getElementById("reg-user").value.trim();
  const password = document.getElementById("reg-pass").value;
  const password2 = document.getElementById("reg-pass2").value;

  if (password !== password2) {
    alert("Las contraseñas no coinciden");
    return;
  }

  const { data, error } = await supabase.auth.signUp({
    email,
    password
  });

  if (error) {
    alert(error.message);
    return;
  }

  currentUser = data.user;
  startApp();
}

async function doLogout() {
  await supabase.auth.signOut();
  location.reload();
}

async function startApp() {
  document.getElementById("auth-screen").style.display = "none";
  document.getElementById("app-screen").style.display = "block";
  document.getElementById("user-display").textContent = currentUser.email;

  populatemonth_keySelects();
  await loadAllData();
  renderPanel();
}

/* =========================================================
   CARGA DE DATOS DESDE SUPABASE
========================================================= */

async function loadAllData() {
  const uid = currentUser.id;

  DB.gastos = (await supabase.from("gastos").select("*").eq("user_id", uid)).data || [];
  DB.fijos = (await supabase.from("fijos").select("*").eq("user_id", uid)).data || [];
  DB.programados = (await supabase.from("programados").select("*").eq("user_id", uid)).data || [];
  DB.config = {};

  const cfgs = await supabase.from("config").select("*").eq("user_id", uid);
  cfgs.data?.forEach(c => DB.config[c.month_key] = c);
}

/* =========================================================
   GASTOS
========================================================= */

async function saveGasto() {
  const gasto = {
    user_id: currentUser.id,
    month_key: document.getElementById("gastos-month_key").value,
    fecha: document.getElementById("g-fecha").value,
    desc: document.getElementById("g-desc").value,
    cat: document.getElementById("g-cat").value,
    monto: Number(document.getElementById("g-monto").value),
    notas: document.getElementById("g-notas").value
  };

  const { error } = await supabase.from("gastos").insert(gasto);
  if (error) return alert(error.message);

  closeModal("modal-gasto");
  await loadAllData();
  renderGastos();
}

/* =========================================================
   FIJOS
========================================================= */

async function saveFijo() {
  const fijo = {
    user_id: currentUser.id,
    month_key: document.getElementById("fijos-month_key").value,
    desc: document.getElementById("f-desc").value,
    monto: Number(document.getElementById("f-monto").value),
    notas: document.getElementById("f-notas").value
  };

  const { error } = await supabase.from("fijos").insert(fijo);
  if (error) return alert(error.message);

  closeModal("modal-fijo");
  await loadAllData();
  renderFijos();
}

/* =========================================================
   PROGRAMADOS
========================================================= */

async function saveProgramado() {
  const prog = {
    user_id: currentUser.id,
    month_key: document.getElementById("prog-month_key").value,
    desc: document.getElementById("p-desc").value,
    monto: Number(document.getElementById("p-monto").value),
    notas: document.getElementById("p-notas").value
  };

  const { error } = await supabase.from("programados").insert(prog);
  if (error) return alert(error.message);

  closeModal("modal-prog");
  await loadAllData();
  renderProgramados();
}

/* =========================================================
   CONFIG MES
========================================================= */

async function saveConfig() {
  const month_key = document.getElementById("panel-month_key").value;

  const config = {
    user_id: currentUser.id,
    month_key,
    bruto: Number(document.getElementById("cfg-bruto").value),
    imp_pct: Number(document.getElementById("cfg-impuesto").value),
    ahorro_pct: Number(document.getElementById("cfg-ahorro-pct").value)
  };

  await supabase.from("config").upsert(config);
  await loadAllData();
  toast("Configuración guardada ✅");
}

</script>
</body>
</html>
